<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de Sesión</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

    <!-- Encabezado -->

    <header>

        <h1>Sistema de Gestión de Egresados</h1>

        <p>Departamento de Bienestar Estudiantil</p>

        <p>Universidad CENFOTEC</p>

    </header>

    <!-- Menú -->

    <nav>

        <a href="index.html">Inicio</a>

        <a href="login.html">Iniciar sesión</a>

        <a href="perfil.html">Perfil</a>

        <a href="egresados.html">Egresados</a>

        <a href="carreras.html">Carreras</a>

    </nav>

    <main class="contenedor-login">

        <section class="login">

            <h2>Inicio de Sesión</h2>

            <p>
                Ingrese sus credenciales para acceder al sistema.
            </p>

            <form id="formLogin">

                <label for="correo">Correo electrónico</label>

                <input
                    type="email"
                    id="correo"
                    placeholder="correo@ucenfotec.ac.cr" required>
                
                <br><br>

                <label for="password">Contraseña</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Ingrese su contraseña"
                    required>
        
                <br><br>

                <label for="rol">Rol</label>

                <select id="rol" required>

                    <option value="">Seleccione un rol</option>

                    <option value="registro">Registro</option>

                    <option value="bienestar">Bienestar Estudiantil</option>

                    <option value="egresado">Egresado</option>

                </select>

                <br><br>

                <button type="submit" class="btn">

                    Ingresar

                </button>

            </form>

        </section>

    </main>

    <footer>

        <p>Sistema de Gestión de Egresados</p>

        <p>Universidad CENFOTEC - 2026</p>

    </footer>
<script src="js/script.js"></script>
</body>

</html>
